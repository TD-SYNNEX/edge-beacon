name: Deploy to AWS (Staging)

on:
  workflow_run:
    workflows: ["Verify AI Atlas"]
    branches: [staging]
    types: [completed]

permissions:
  id-token: write # required for GitHub OIDC -> AWS role assumption
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same VITE_COGNITO_* names as deploy.yml, but resolved from the
      # "staging" environment's own values (separate Cognito pool/client) —
      # see DEPLOYMENT.md's staging section for how those were set.
      - run: npm ci
      - run: npm run build
        env:
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ vars.VITE_COGNITO_REGION }}

      # No static AWS keys: this role only exists to be assumed from this
      # repo's staging branch and only has permission to assume the CDK
      # bootstrap roles, which already carry least-privilege
      # CloudFormation/S3/ECR permissions on their own.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: npm ci
        working-directory: infra
      - run: npx cdk deploy EdgeBeaconStagingStack --require-approval never
        working-directory: infra
