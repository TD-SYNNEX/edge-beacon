name: Verify AI Atlas

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      # Placeholder Cognito values so the signed-out landing specs reach the
      # sign-in redirect; this build is verification only (deploys build with
      # the real values from environment variables).
      - run: npm run build
        env:
          VITE_COGNITO_DOMAIN: e2e
          VITE_COGNITO_CLIENT_ID: e2e
          VITE_COGNITO_REGION: us-east-1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
