name: Deploy to AWS

on:
  workflow_run:
    workflows: ["Verify AI Atlas"]
    branches: [main]
    types: [completed]

permissions:
  id-token: write # required for GitHub OIDC -> AWS role assumption
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Builds dist/client + dist/server/index.mjs, which the CDK app
      # references as its S3 and Lambda code assets. VITE_COGNITO_* are not
      # secret (they end up in the public browser bundle either way) but
      # .env is gitignored, so they must come from repo variables here —
      # confirmed live: without them, the built bundle silently omits the
      # real Cognito domain/client ID and the deployed app crashes at
      # startup with "Sign-in is not configured" (src/auth.ts), wiping out
      # a previous manual fix on the very next automated deploy.
      - run: npm ci
      - run: npm run build
        env:
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ vars.VITE_COGNITO_REGION }}

      # No static AWS keys: this role only exists to be assumed from this
      # repo's main branch (see the trust policy note below) and only has
      # permission to assume the CDK bootstrap roles, which already carry
      # least-privilege CloudFormation/S3/ECR permissions on their own.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: npm ci
        working-directory: infra
      # Explicit stack name: the CDK app now also defines
      # EdgeBeaconStagingStack (see deploy-staging.yml), so a bare
      # `cdk deploy` with no argument would refuse to pick one.
      - run: npx cdk deploy EdgeBeaconStack --require-approval never
        working-directory: infra
